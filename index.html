   ===================================================================== */
function enterRace() {
  keysDown.clear();
  clearTouch();
  stopEngine();
  race.dust = [];
  race.lastCount = null;
  race.finishCount = 0;
  race.finishDeadline = null;

  // Player 1 = car 3 (his car). Cars 1 and 2 go to players 2 and 3 if they
  // are playing, otherwise the computer drives them.
  const n = game.numPlayers;
  const human = i => ({
    index: i,
    name: i === 0 ? game.teamName : `Spiller ${i + 1}`,
    color: PLAYER_COLORS[i],
    keysLabel: PLAYER_KEYS[i].label,
  });
  race.player = makeCar(game.cars[2], START_SLOTS.player, { human: human(0) });
  const car1 = makeCar(game.cars[0], START_SLOTS.ai0, n >= 2 ? { human: human(1) } : { ai: AI_CARS[0] });
  const car2 = makeCar(game.cars[1], START_SLOTS.ai1, n >= 3 ? { human: human(2) } : { ai: AI_CARS[1] });
  race.cars = [car1, race.player, car2];
  race.humans = race.cars.filter(c => c.isPlayer).sort((a, b) => a.human.index - b.human.index);
  race.state = "countdown";
  race.clock = 0;
  race.time = 0;
  race.banner = null;
  game.results = null;
  touching.clear();
  if (race.frameId) cancelAnimationFrame(race.frameId);
  race.lastTime = performance.now();
  race.frameId = requestAnimationFrame(raceFrame);
}
document.getElementById("race-next").addEventListener("click", enterRace);   // restart this race

/* =====================================================================
   SCREEN 5: RESULTS  (podium + confetti when he wins)
   ===================================================================== */
function enterResults() {
  const results = game.results || [];
  const multi = results.filter(r => r.isPlayer).length > 1;
  const place = results.findIndex(r => r.playerIndex === 0) + 1;   // player 1's place
  const celebrate = multi ? results[0] && results[0].isPlayer : place === 1;

  const title = document.getElementById("results-title");
  const sub = document.getElementById("results-sub");
  if (multi) {
    const winner = results[0];
    if (winner.isPlayer) {
      title.textContent = `🏆 ${winner.name} VANDT! 🏆`;
      sub.textContent = "Godt kørt alle sammen! Kør igen for en revanche!";
    } else {
      title.textContent = `${winner.name} vandt! 🤖`;
      sub.textContent = "Prøv igen – sammen kan I godt slå computeren!";
    }
  } else if (place === 1) {
    title.textContent = "🏆 DU VANDT! 🏆";
    sub.textContent = `${game.teamName} er de hurtigste på banen!`;
  } else if (place === 2) {
    title.textContent = "Flot kørt – 2. plads! 🥈";
    sub.textContent = "Så tæt på! Prøv igen – du kan godt vinde!";
  } else {
    title.textContent = "3. plads – godt kæmpet! 🥉";
    sub.textContent = game.difficulty === "50"
      ? "Prøv igen – hold dig på vejen, så går det hurtigere!"
      : "Prøv igen – eller vælg en lettere sværhed!";
  }

  // Podium: 2nd on the left, 1st in the middle, 3rd on the right
  const podium = document.getElementById("podium");
  podium.innerHTML = "";
  for (const i of [1, 0, 2]) {
    const r = results[i];
    if (!r) continue;
    const step = document.createElement("div");
    step.className = `step p${i + 1}` + (r.isPlayer ? " mine" : "");
    const c = document.createElement("canvas");
    c.width = 230; c.height = 120;
    drawFit(c.getContext("2d"), r.img, 8);
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = r.isPlayer ? `⭐ ${r.name}` : r.name;
    const block = document.createElement("div");
    block.className = "block";
    block.textContent = i + 1;
    step.append(c, name, block);
    podium.appendChild(step);
  }

  if (celebrate) { startConfetti(); sfx.win(); }
  else clearConfetti();
}

/* ---- Confetti ---- */
const confettiCanvas = document.getElementById("confetti");
const confettiCtx = confettiCanvas.getContext("2d");
const CONFETTI_COLORS = ["#e8433c", "#ff8c42", "#ffd23f", "#2fbf71", "#3a86ff", "#9b5de5", "#f15bb5"];
let confetti = [];
let confettiFrame = null;

function makeConfettiPiece(fromTop) {
  return {
    x: Math.random() * GAME_W,
    y: fromTop ? -20 - Math.random() * 200 : Math.random() * GAME_H,
    vx: (Math.random() - 0.5) * 80,
    vy: 120 + Math.random() * 160,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 10,
    w: 8 + Math.random() * 8,
    h: 5 + Math.random() * 5,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
  };
}

function startConfetti() {
  confetti = [];
  for (let i = 0; i < 220; i++) confetti.push(makeConfettiPiece(true));
  const startTime = performance.now();
  let last = startTime;
  if (confettiFrame) cancelAnimationFrame(confettiFrame);
  const frame = now => {
    if (currentScreen !== "results") { clearConfetti(); return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const raining = now - startTime < 5000;   // keep it coming for 5 seconds
    for (const p of confetti) {
      p.x += (p.vx + Math.sin(now / 300 + p.rot) * 30) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.y > GAME_H + 20 && raining) Object.assign(p, makeConfettiPiece(true));
    }
    confetti = confetti.filter(p => p.y <= GAME_H + 20);
    confettiCtx.clearRect(0, 0, GAME_W, GAME_H);
    for (const p of confetti) {
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      confettiCtx.restore();
    }
    confettiFrame = confetti.length ? requestAnimationFrame(frame) : null;
  };
  confettiFrame = requestAnimationFrame(frame);
}

function clearConfetti() {
  if (confettiFrame) cancelAnimationFrame(confettiFrame);
  confettiFrame = null;
  confetti = [];
  confettiCtx.clearRect(0, 0, GAME_W, GAME_H);
}
document.getElementById("btn-again").addEventListener("click", () => showScreen("race"));
document.getElementById("btn-newtrack").addEventListener("click", () => showScreen("setup"));
document.getElementById("btn-restart").addEventListener("click", () => {
  game.teamName = ""; game.cars = []; game.track = null; game.drawnTrack = null;
  showScreen("team");
});

/* =====================================================================
   START
   ===================================================================== */
showScreen("team");
</script>
